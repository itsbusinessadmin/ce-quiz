# Publishes the site to Firebase Hosting (https://cequiz-e7587.web.app) on every push to main.
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret; see README "Put it online".
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (secret not set yet)
        if: env.HAS_SECRET != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to deploy. See README."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SECRET == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cequiz-e7587
          channelId: live
